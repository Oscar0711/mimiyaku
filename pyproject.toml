[project]
name = "omni2"
version = "0.1.0"
description = "OmniTranslate v2：本地語音辨識與字幕翻譯"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Oscar0711" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "soxr>=0.4",
    "platformdirs>=4.2",
    "faster-whisper>=1.1",
    "opencc>=1.1.9",
    "yt-dlp>=2025.1",
    "PySide6>=6.8",
    # 雲端語音辨識與金鑰保存（M3）
    "keyring>=25",
    "dashscope>=1.20",
    "openai>=1.50",
    "google-cloud-speech>=2.26",
    # 即時模式（M4）：麥克風與系統聲音、指定程式的聲音、列出正在發聲的程式
    "PyAudioWPatch>=0.2.12",
    "comtypes>=1.4",
    "pycaw>=20240316",
    # 以下是 M2：Qwen3-ASR、人聲分離、講者分離。都在子行程裡才會 import。
    # torchaudio 在 CUDA 13 只出到 2.11，SpeechBrain 又需要它，所以兩者一起鎖在 2.11。
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "qwen-asr>=0.0.6",
    "audio-separator>=0.47",
    "audioread>=3.0",  # audio-separator 經由 librosa 讀檔時需要，但沒有列在它的相依裡
    "speechbrain>=1.1",
    "pyannote.audio>=4.0",  # 可選的講者分離引擎；模型需要 Hugging Face 帳號同意條款
]

[tool.uv]
# 只在 Windows 上使用；不限定的話 uv 也會幫 macOS 解相依而產生衝突
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.urls]
Homepage = "https://github.com/Oscar0711/omni-translate"
Issues = "https://github.com/Oscar0711/omni-translate/issues"
Discussions = "https://github.com/Oscar0711/omni-translate/discussions"

[project.scripts]
omni2 = "omni2.cli:main"

[project.gui-scripts]
omni2-gui = "omni2.ui.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
